name: Deploy to GitHub Pages

on:
  # 每次 push 到 main 分支时触发
  push:
    branches: [main]
  # 允许在 GitHub Actions 页面手动触发
  workflow_dispatch:

# 让 GITHUB_TOKEN 具有 Pages 部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署,取消排队中的旧部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 首次运行时自动启用 GitHub Pages(Actions 构建模式)
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install, build (with pnpm)
        uses: withastro/action@v3
        with:
          package-manager: pnpm@latest

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
